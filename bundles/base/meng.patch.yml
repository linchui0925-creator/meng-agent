# 梦 · base 组合清单
#
# 规则 (与 dsh 一致的三条, 加我们自己的两条):
#   1. profile 根恒为 []  —— base 是"第一层", 不是"特例"
#   2. 行序不携带加载语义 —— 激活由依赖可用性决定, 不靠写的先后
#   3. patch 替换整段 config, 不与下层合并 —— 所以"随模式变化"的行放 mode bundle
#   4. 【我们】base 最多 12 行 —— 超过 12 行说明该拆 bundle 了
#   5. 【我们】每行必须有 invariant —— 装了但半残, 要在 200ms 内说出来
#
# 顺序按"读者理解路径"排: 模型 → 记录 → 工具 → 提示 → 循环。
# 装载器只看依赖 (inject), 不看这个顺序。

- insert:
    # 配置能力面。**放在最前**不是为了加载顺序 (装载器只看 inject), 是为了读者:
    # 下面每一行的 config 值, 取值规则都由它定义 (界面 > env > 默认)。
    # 它不装, 内核照样跑 —— 只是所有共享配置退回"各自读 env"的老样子
    - id: config
      name: '@meng/plugin-config-local'
      config:
        dir: !!js process.env.MENG_DATA_DIR || '.meng'

    # 模型访问。provider 不在这里配 —— provider 是插件, 见 plugins/provider-*
    - id: llm
      name: '@meng/llm'
      config:
        defaultModel:
          provider: ''
          model: ''

    # 会话完整模块：SQLite 真相源、旧 JSONL 一次性导入、分页与管理都在内部。
    - id: session
      name: '@meng/session'
      config:
        dir: !!js process.env.MENG_DATA_DIR || '.meng'

    # 记住"用户加过哪些目录"。会话自己带 workspace（写在事件里），这里存的是
    # **还没有会话的那部分** —— 选择器要用它（"在这个目录里开一个"）
    - id: workspaces
      name: '@meng/workspaces'
      config:
        dir: !!js process.env.MENG_DATA_DIR || '.meng'

    # 工具调用的完整记录 (本地 SQLite)。**可丢的附属数据**, 不是真相源:
    # 事件流里只留 2000 字回显 + 一个 recordId, 全文在这里 —— 回放不该读几 MB 的 stdout
    - id: records
      name: '@meng/records'
      config:
        dir: !!js process.env.MENG_DATA_DIR || '.meng'

    # 工具注册 + 四段执行管线
    - id: tools
      name: '@meng/tools'

    # 系统提示分区
    - id: prompt
      name: '@meng/prompt'
      config:
        persona: ''

    # 对话循环。**这是插件, 不是内核** —— 换一种循环策略 (先规划再执行、
    # 单轮不循环) 就是换这一行, 内核一行不用动。缝在 @meng/loop, 这里只是
    # 它的一种填法 (最基本的 ReAct)。依赖上面四个, 缺一个就保持 pending 而不是崩
    - id: loop-basic
      name: '@meng/plugin-loop-basic'
      config:
        checkpointEvery: 20
        hardStopSteps: 500

    # 记忆与上下文压缩。外部是一个插件，内部拆成压缩、搜索库和技能说明。
    - id: memory
      name: '@meng/plugin-memory'
      config:
        dir: !!js process.env.MENG_DATA_DIR || '.meng'
        thresholdRatio: 0.8
        retainRatio: 0.16
        summaryMaxTokens: 8192
        instructionFilename: AGENTS.md
        instructionMaxBytes: 65536

    # ── 以下是 P1 建包后启用的策略行, 现在注释掉 ──────────────────
    # 打开前记得先建对应包, 否则装载器会把它们记成 failed (这是对的:
    # 声明了却不存在的包, 应该在状态图里红着, 而不是静默略过)
