# DeepSeek 官方接入。
#
# 默认 disabled：没有 key 时装载它会让默认模型变成 deepseek-*，用户打第一句话
# 才报"没凭据" —— 晚失败比早失败难查。要用就显式打开：
#   MENG_PROVIDER=deepseek DEEPSEEK_API_KEY=sk-xxx meng
#
# 密钥只以**环境变量名**出现在这里（apiKeyEnv），清单里永远不写明文 ——
# 清单会进 git、进日志、进别人的截图。

- insert:
    - id: provider-deepseek
      name: '@meng/provider-deepseek'
      disabled: !!js process.env.MENG_PROVIDER !== 'deepseek'
      config:
        id: deepseek
        baseURL: !!js process.env.DEEPSEEK_BASE_URL || 'https://api.deepseek.com'
        apiKeyEnv: DEEPSEEK_API_KEY
        models:
          - deepseek-chat
          - deepseek-reasoner
        # 默认不写 thinking 字段，让服务端默认生效。
        # 要开思考就：
        #   thinking: enabled
        #   reasoningEffort: high   # off / high / max
