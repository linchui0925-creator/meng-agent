# OpenAI 兼容 provider (edgefn / 智谱 / minimax / 任何 /v1/chat/completions)。
#
# **装了这一个插件 = 装了"任意多家 OpenAI 协议网关"。** 它的配置是一张
# `routes` 字典, 一个 key 一条路由 —— 用户想接自己的网关, 在设置页加一行就行,
# 不需要我们再写插件, 也不需要重启 (配置写完立刻落到注册表)。
#
# 平时不用这个文件: server 走 apps/server/providers.meng.patch.yml (全装)。
#
# 这里**故意没有 config 块** —— 理由同 provider-deepseek:
# 配置项在 src/index.ts 的 CONFIG 里用 zod 声明, 值走配置层。
#
# 特别注意**: 以前这里写过 `apiKey: <明文>`。那行已经删了, 别加回来 ——
# 清单会进 git、进日志、进别人的截图, 而密钥只该以环境变量名的形式存在
# (MENG_LLM_API_KEY, 老名字 OPENAI_API_KEY 仍然认)。

- insert:
    - id: provider-openai
      name: '@meng/provider-openai'
